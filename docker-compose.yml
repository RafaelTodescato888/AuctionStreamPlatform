services:
  gateway.webapi:
    container_name: gateway.webapi
    image: ${DOCKER_REGISTRY-}gatewaywebapi
    build:
      context: .
      dockerfile: src/Gateway/Gateway.WebApi/Dockerfile
    networks:
      - server
  user.webapi:
    container_name: user.webapi
    image: ${DOCKER_REGISTRY-}userwebapi
    build:
      context: .
      dockerfile: src/Services/User/User.WebApi/Dockerfile
    networks:
      - server
  db:
    container_name: db
    image: postgres:18.3
    networks:
      - server
  redis:
    container_name: redis
    image: redis:alpine
    networks:
      - server
  kafka:
    container_name: kafka
    image: apache/kafka:4.4.0
    networks:
      - server
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - server
  loki:
    image: grafana/loki:latest
    container_name: loki
    networks:
      - server
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    networks:
      - server
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    networks:
      - server
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - server

networks:
  server:

volumes:
  db_data:
  grafana_data: