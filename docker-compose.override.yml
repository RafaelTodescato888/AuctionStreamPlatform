services:
  gateway.webapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - GATEWAY_API_PORT=${GATEWAY_API_PORT}
      - DEFAULT_HTTP_PORT=${DEFAULT_HTTP_PORT}
      - TokenGenerationConfig__JwtSecret=${TokenGenerationConfig__JwtSecret}
    ports:
      - "${GATEWAY_API_PORT}:${DEFAULT_HTTP_PORT}"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
  user.webapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - USER_CONTEXT_DATA_SOURCE=${USER_CONTEXT_DATA_SOURCE}
      - REDIS_DATA_SOURCE=${REDIS_DATA_SOURCE}
      - USER_API_PORT=${USER_API_PORT}
      - DEFAULT_HTTP_PORT=${DEFAULT_HTTP_PORT}
      - TokenGenerationConfig__MaxBytes=${TokenGenerationConfig__MaxBytes}
      - TokenGenerationConfig__LanesNumber=${TokenGenerationConfig__LanesNumber}
      - TokenGenerationConfig__MemorySize=${TokenGenerationConfig__MemorySize}
      - TokenGenerationConfig__Iterations=${TokenGenerationConfig__Iterations}
      - TokenGenerationConfig__Hash=${TokenGenerationConfig__Hash}
      - TokenGenerationConfig__JwtSecret=${TokenGenerationConfig__JwtSecret}
      - TokenGenerationConfig__DefaultExpiration=${TokenGenerationConfig__DefaultExpiration}
      - AdminCredentialsConfig__Name=${AdminCredentialsConfig__Name}
      - AdminCredentialsConfig__Email=${AdminCredentialsConfig__Email}
      - AdminCredentialsConfig__Document=${AdminCredentialsConfig__Document}
      - AdminCredentialsConfig__Password=${AdminCredentialsConfig__Password}
      - LoginAttemptsConfig__MaxFailedLoginAttempts=${LoginAttemptsConfig__MaxFailedLoginAttempts}
      - Kafka__Consumer__Config__BootstrapServers=kafka:9092
      - Kafka__Producer__Config__BootstrapServers=kafka:9092
      - Kafka__Consumer__Config__AllowAutoCreateTopics=true
      - LOKI_SERVICE_URL=${LOKI_SERVICE_URL}
      - OPEN_TELEMETRY_URL=${OPEN_TELEMETRY_URL}
    ports:
      - "${USER_API_PORT}:${DEFAULT_HTTP_PORT}"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
  db:
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_DEFAULT_PORT}:${POSTGRES_DEFAULT_PORT}"
    volumes:
      - db_data:/var/lib/postgresql
  redis:
    ports:
      - "${REDIS_DEFAULT_PORT}:${REDIS_DEFAULT_PORT}"
  kafka:
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:${KAFKA_DEFAULT_PORT},EXTERNAL://:${KAFKA_DEFAULT_EXTERNAL_PORT},CONTROLLER://:${KAFKA_DEFAULT_CONTROLLER_PORT}
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:${KAFKA_DEFAULT_PORT},EXTERNAL://localhost:${KAFKA_DEFAULT_EXTERNAL_PORT}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:${KAFKA_DEFAULT_CONTROLLER_PORT}
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "${KAFKA_DEFAULT_PORT}:${KAFKA_DEFAULT_PORT}"
      - "${KAFKA_DEFAULT_EXTERNAL_PORT}:${KAFKA_DEFAULT_EXTERNAL_PORT}"
  prometheus:
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_DEFAULT_PORT}:${PROMETHEUS_DEFAULT_PORT}"
  loki:
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
    ports:
      - "${LOKI_DEFAULT_PORT}:${LOKI_DEFAULT_PORT}"
  promtail:
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
    command: -config.file=/etc/promtail/config.yml
  tempo:
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml
    ports:
      - "${TEMPO_GRPC_DEFAULT_PORT}:${TEMPO_GRPC_DEFAULT_PORT}"
      - "${TEMPO_HTTP_DEFAULT_PORT}:${TEMPO_HTTP_DEFAULT_PORT}"
      - "${TEMPO_FALLBACK_PORT}:${TEMPO_FALLBACK_PORT}"
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_DEFAULT_PORT}:${GRAFANA_DEFAULT_PORT}"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USERNAME}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki