services:
  gateway.webapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - GATEWAY_API_PORT=${GATEWAY_API_PORT}
      - DEFAULT_HTTP_PORT=${DEFAULT_HTTP_PORT}
      - AppConfig__JwtSecret=${AppConfig__JwtSecret}
    ports:
      - "${GATEWAY_API_PORT}:${DEFAULT_HTTP_PORT}"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
  user.webapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - CONTEXT_DATA_SOURCE=${CONTEXT_DATA_SOURCE}
      - REDIS_DATA_SOURCE=${REDIS_DATA_SOURCE}
      - USER_API_PORT=${USER_API_PORT}
      - DEFAULT_HTTP_PORT=${DEFAULT_HTTP_PORT}
      - AppConfig__MaxBytes=${AppConfig__MaxBytes}
      - AppConfig__LanesNumber=${AppConfig__LanesNumber}
      - AppConfig__MemorySize=${AppConfig__MemorySize}
      - AppConfig__Iterations=${AppConfig__Iterations}
      - AppConfig__Hash=${AppConfig__Hash}
      - AppConfig__JwtSecret=${AppConfig__JwtSecret}
      - AppConfig__DefaultExpiration=${AppConfig__DefaultExpiration}
      - AdminConfig__Name=${AdminConfig__Name}
      - AdminConfig__Email=${AdminConfig__Email}
      - AdminConfig__Document=${AdminConfig__Document}
      - AdminConfig__Password=${AdminConfig__Password}
      - Kafka__Consumer__Config__BootstrapServers=kafka:9092
      - Kafka__Producer__Config__BootstrapServers=kafka:9092
      - Kafka__Consumer__Config__AllowAutoCreateTopics=true
    ports:
      - "${USER_API_PORT}:${DEFAULT_HTTP_PORT}"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
  db:
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_DEFAULT_PORT}:${POSTGRES_DEFAULT_PORT}"
  redis:
    ports:
      - "${REDIS_DEFAULT_PORT}:${REDIS_DEFAULT_PORT}"
  kafka:
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9092:9092"
      - "29092:29092"